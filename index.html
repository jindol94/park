<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRE-RUN 러너스 파크</title>
<meta name="description" content="PRE-RUN 러너스 파크 — 광장에서 대회 게이트로 들어가 코스를 미리 달려보세요">
<meta property="og:title" content="PRE-RUN 러너스 파크">
<meta property="og:description" content="PRE-RUN 러너스 파크">
<meta property="og:type" content="website">
<meta name="theme-color" content="#edf2f3">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 페이지 안에서 광장(park)과 코스(course) 두 장면을 오감. body[data-mode]로 HUD를 바꿈 */
:root{
  --sky:#BFE3F5; --grass:#A8D8B9; --path:#EADFC8; --track:#D9765F; --ginkgo:#F2C94C; --maple:#D9542B; --water:#6FB3D6;
  --ink:#0E2730; --accent:#E0306F; --surface:#FFFFFF; --sub:#6E7D83; --line:#D4E1DE; --glass:rgba(255,255,255,.86);
  --num:"Barlow Condensed","Noto Sans KR",system-ui,sans-serif; --kr:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--kr);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:none;background:none;padding:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.hud{position:fixed;z-index:5}
.glass{background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(14,39,48,.08)}
body[data-mode=park] .c-only,body[data-mode=course] .p-only{display:none!important}
/* 광장 HUD */
.tl{top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,calc(env(safe-area-inset-left,0px) + 12px))}
.me{display:flex;align-items:center;gap:10px;border-radius:16px;padding:6px 12px 6px 8px}
.me img{width:34px;height:34px;display:block}
.me .nm{font-weight:700;font-size:14px;line-height:1.1}
.me .sb{font-size:11px;color:var(--sub)}
.tr{top:calc(env(safe-area-inset-top,0px) + 12px);right:max(12px,calc(env(safe-area-inset-right,0px) + 12px))}
.badge{font-family:var(--num);font-weight:700;font-size:15px;border-radius:999px;padding:7px 14px;letter-spacing:.02em}
.badge b{color:var(--accent)}
.joy{left:max(16px,calc(env(safe-area-inset-left,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:130px;height:130px;touch-action:none}
body[data-mode=course] .joy{bottom:calc(env(safe-area-inset-bottom,0px) + 112px);width:116px;height:116px}
.joy img{position:absolute;pointer-events:none}
.joy .base{inset:0;width:100%;height:100%}
.joy .knob{width:52px;height:52px;left:calc(50% - 26px);top:calc(50% - 26px);transition:transform .08s}
.joy.active .knob{transition:none}
.runb{right:max(22px,calc(env(safe-area-inset-right,0px) + 22px));bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 6px 16px rgba(14,39,48,.15);display:grid;place-items:center}
.runb img{width:34px;height:34px}
.runb.on{background:var(--accent)}
.runb.on img{filter:brightness(0) invert(1)}
.keys{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);font-size:12px;background:rgba(255,255,255,.75);border-radius:999px;padding:6px 12px;white-space:nowrap}
body[data-mode=course] .keys{bottom:calc(env(safe-area-inset-bottom,0px) + 112px)}
@media (pointer:coarse){.keys{display:none!important}}
@media (pointer:fine){.joy,.runb{display:none!important}}
.card{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;width:min(340px,calc(100% - 200px));min-width:240px;background:var(--surface);border-radius:20px;padding:16px 18px;box-shadow:0 12px 32px rgba(14,39,48,.18);display:grid;gap:10px}
@media (max-width:560px){.card{bottom:calc(env(safe-area-inset-bottom,0px) + 170px);width:calc(100% - 32px);min-width:0;grid-template-columns:1fr auto;column-gap:12px;row-gap:2px;padding:12px 14px;border-radius:16px}.card .tag{grid-column:1}.card .t{grid-column:1;font-size:16px}.card .m{grid-column:1;gap:8px;font-size:12px}.card .m b{font-size:14px}.card .m span:last-child{display:none}.card .ctas{grid-column:2;grid-row:1/4;align-self:center}.card .ctas button{padding:12px 14px;white-space:nowrap}}
.card.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.card .t{font-weight:700;font-size:18px;letter-spacing:-.02em}
.card .m{display:flex;gap:12px;font-size:13px;color:var(--sub);flex-wrap:wrap}
.card .m b{font-family:var(--num);font-size:16px;color:var(--ink);font-weight:700}
.card .ctas{display:flex;gap:8px}
.card .ctas button{flex:1;text-align:center;font-weight:700;font-size:14px;border-radius:12px;padding:11px 8px;background:var(--accent);color:#fff}
.card .tag{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.toast{left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;border-radius:999px;padding:8px 14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:8}
.toast.show{opacity:1}
/* 코스 HUD */
.ctl{display:grid;gap:8px;justify-items:start}
.back{display:flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px 6px 8px;font-size:12px;font-weight:700}
.back img{width:20px;height:20px}
.kmbox{border-radius:16px;padding:10px 14px;min-width:150px}
.kmbox .km{font-family:var(--num);font-weight:700;font-size:34px;line-height:1;letter-spacing:.01em}
.kmbox .km small{font-size:16px;color:var(--sub);margin-left:3px}
.kmbox .sec{font-size:13px;font-weight:700;margin-top:4px;display:flex;gap:8px;align-items:baseline}
.kmbox .gr{font-family:var(--num);font-size:15px;color:var(--sub)}
.kmbox .gr.up{color:var(--maple)}.kmbox .gr.dn{color:#2B8FB8}
.clockb{border-radius:16px;padding:10px 14px;text-align:right}
.clockb .tm{font-family:var(--num);font-weight:700;font-size:30px;line-height:1}
.clockb .pc{font-size:12px;color:var(--sub);margin-top:4px}
.clockb .pc b{font-family:var(--num);font-size:15px;color:var(--ink)}
.note{left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none}
.note.show{opacity:1}
.note.hot{background:var(--accent);color:#fff}
.note b{font-family:var(--num);font-size:16px}
@media (max-width:560px){.note{top:calc(env(safe-area-inset-top,0px) + 132px)}}
.bottom{left:0;right:0;bottom:0;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px));display:grid;gap:10px;pointer-events:none}
.ctrl{display:flex;justify-content:flex-end;gap:8px;pointer-events:auto}
.cb{height:48px;min-width:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;font-weight:700;font-size:14px}
.cb img{width:22px;height:22px}
.cb.spd{font-family:var(--num);font-size:20px;min-width:72px}
.cb.mode{font-size:12px;color:var(--sub);padding:0 12px}
.cb.mode.man{background:var(--accent);color:#fff}
.elev{pointer-events:auto;border-radius:16px;padding:8px 10px 6px}
.elev canvas{display:block;width:100%;height:58px;cursor:pointer;touch-action:none}
.elev .lg{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:2px;gap:8px}
/* 오버레이 */
body[data-mode=course] .glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,255,255,.93)}
body[data-mode=course] .note.hot,body[data-mode=course] .cb.mode.man{background:var(--accent)}
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(191,227,245,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:16px;overflow:auto}
.box{width:min(380px,100%);background:var(--surface);border-radius:24px;padding:24px 20px;display:grid;gap:14px;box-shadow:0 20px 50px rgba(14,39,48,.18)}
.box.center{text-align:center}
.box .logo{height:44px;margin:0 auto}
.box .tag{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.box h1{margin:-8px 0 0;font-size:24px;letter-spacing:-.02em}
.box p,.box .meta{margin:0;font-size:13px;color:var(--sub);line-height:1.6}
.box input{font:inherit;font-size:18px;font-weight:700;text-align:center;border:2px solid var(--line);border-radius:14px;padding:12px;outline:none;color:var(--ink);user-select:text;-webkit-user-select:text}
.box input:focus{border-color:var(--accent)}
.gseg button{padding:12px 4px}
.me{cursor:pointer}
.tachip{left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);border-radius:16px;padding:8px 18px;text-align:center;min-width:120px}
.tachip .tt{font-family:var(--num);font-weight:700;font-size:30px;line-height:1}
.tachip .ts{font-size:12px;color:var(--sub);margin-top:3px;white-space:nowrap}
.tachip.win .tt{color:var(--accent)}
@media (max-width:560px){.toast{top:calc(env(safe-area-inset-top,0px) + 140px)}.tachip{top:calc(env(safe-area-inset-top,0px) + 66px)}}
.cd{left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--num);font-weight:700;font-size:120px;line-height:1;color:#fff;text-shadow:0 6px 24px rgba(14,39,48,.35);pointer-events:none}
.tr{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.rbtn{font-weight:700;font-size:13px;border-radius:999px;padding:8px 14px;display:flex;align-items:center;gap:6px}
.rbtn i{font-style:normal;color:var(--accent)}
.crow{display:flex;gap:6px}
.rhead{display:flex;justify-content:space-between;align-items:center}
.rhead h1{margin:0}
.rhead button{width:36px;height:36px;border-radius:50%;background:#EEF3F2;font-size:16px}
.rlist{display:grid;gap:10px;max-height:min(62vh,520px);overflow:auto;margin:0 -4px;padding:0 4px}
.rc{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:6px}
.rc.cur{border-color:var(--accent)}
.rc .rt{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.rc .dd{font-family:var(--num);font-size:14px;color:var(--ink);background:#EEF3F2;border-radius:999px;padding:1px 9px;letter-spacing:0}
.rc .dd.up{background:var(--accent);color:#fff}
.rc .rn{font-weight:700;font-size:17px;letter-spacing:-.02em}
.rc .rd{font-size:12px;color:var(--sub)}
.rc .rcs{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.rc .rcs button{flex:1;min-width:110px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;padding:10px 8px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:6px}
.rc .rcs button small{font-family:var(--num);font-size:14px;font-weight:600;opacity:.85}
.rc .rx{font-size:11px;color:var(--sub)}
.box .err{font-size:12px;color:var(--maple);min-height:16px}
.box .lab{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:#EEF3F2;border-radius:14px;padding:4px}
.seg button{border-radius:10px;padding:10px 4px;font-weight:700;font-size:14px;color:var(--sub)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(14,39,48,.1)}
.seg button small{display:block;font-family:var(--num);font-size:13px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;font-family:var(--num);font-weight:700;font-size:16px}
.chips button[aria-pressed=true]{border-color:var(--accent);background:var(--accent);color:#fff}
.go{background:var(--accent);color:#fff;font-weight:700;font-size:16px;border-radius:14px;padding:14px;text-align:center;display:block;width:100%}
.go.sec{background:#EEF3F2;color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fine{font-size:11px;color:var(--sub);line-height:1.6}
.big{font-family:var(--num);font-weight:700;font-size:56px;line-height:1;text-align:center}
.fade{position:fixed;inset:0;z-index:30;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--sub)}
.fade.on{opacity:1;pointer-events:auto}
.fallback{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;font-size:15px;line-height:1.6}
@media (prefers-reduced-motion:reduce){.card,.toast,.note,.fade{transition:none}}
</style>
</head>
<body>


<canvas id="c" aria-label="PRE-RUN 러너스 파크 3D 화면"></canvas>
<!-- 광장 HUD -->
<div class="hud tl p-only"><div class="me glass"><img id="logoSym" alt=""><div><div class="nm" id="myName">러너</div><div class="sb">러너스 파크</div></div></div></div>
<div class="hud tr p-only"><div class="badge glass" id="online"><b>●</b> 지금은 혼자예요</div><button class="rbtn glass" id="raceBtn"><i>▶</i>대회 코스 바로가기</button></div>
<div class="hud tachip glass p-only" id="ta" hidden><div class="tt" id="taT">0.00</div><div class="ts" id="taS"></div></div>
<div class="hud cd p-only" id="cd" hidden></div>
<button class="hud runb p-only" id="runb" aria-label="달리기"><img id="runIcon" alt=""></button>
<div class="hud card p-only" id="card" role="dialog" aria-live="polite"></div>
<!-- 코스 HUD -->
<div class="hud tl ctl c-only">
  <div class="crow"><button class="back glass" id="back"><img id="parkIcon" alt="">광장으로</button><button class="back glass" id="raceBtn2">다른 대회</button></div>
  <div class="kmbox glass"><div class="km"><span id="km">0.00</span><small id="kmTot">/ 21.1 km</small></div><div class="sec"><span id="secName">-</span><span class="gr" id="grade">0.0%</span></div></div>
</div>
<div class="hud tr c-only"><div class="clockb glass"><div class="tm" id="clock">0:00:00</div><div class="pc">페이스 <b id="pace">-'--"</b></div><div class="pc" id="crew"></div></div></div>
<div class="hud note glass c-only" id="note" aria-live="polite"></div>
<div class="hud bottom c-only">
  <div class="ctrl">
    <button class="cb mode glass" id="mode" aria-label="자동 주행으로 돌아가기">자동 주행</button>
    <button class="cb spd glass" id="spd" aria-label="배속 바꾸기">10×</button>
    <button class="cb glass" id="play" aria-label="일시정지"><img id="playIcon" alt=""></button>
  </div>
  <div class="elev glass"><canvas id="elev" aria-label="코스 고도. 눌러서 위치 이동"></canvas><div class="lg"><span id="lgA"></span><span>고도 · 눌러서 이동</span><span id="lgB"></span></div></div>
</div>
<!-- 공용 -->
<div class="hud joy" id="joy" aria-label="조이스틱"><img class="base" id="joyBase" alt=""><img class="knob" id="joyKnob" alt=""></div>
<div class="hud keys p-only">방향키·WASD 이동 · Shift 달리기</div>
<div class="hud keys c-only">W·↑ 직접 달리기 · A/D 좌우 · Space 일시정지</div>
<div class="hud toast" id="toast"></div>
<div class="fade" id="fade"><span id="fadeTxt"></span></div>
<div class="fallback" id="fallback">이 기기에서는 3D 화면을 열 수 없어요.<br>PC나 최신 휴대폰 브라우저로 접속해 주세요.</div>

<div class="ov" id="intro">
  <form class="box center" id="introForm">
    <img class="logo" id="logoH" alt="PRE-RUN">
    <p>러너스 파크에 오신 걸 환영해요.<br>광장에서 쓸 닉네임과 캐릭터를 골라 주세요.</p>
    <input id="nick" maxlength="10" placeholder="닉네임 (2–10자)" autocomplete="off" aria-label="닉네임">
    <div class="seg gseg" id="gSeg" role="group" aria-label="캐릭터 성별"><button type="button" data-g="m" aria-pressed="false">남자 러너</button><button type="button" data-g="f" aria-pressed="false">여자 러너</button></div>
    <div class="err" id="err"></div>
    <button class="go" type="submit">입장하기</button>
  </form>
</div>
<div class="ov" id="races" hidden>
  <div class="box">
    <div class="rhead"><h1>대회 코스</h1><button id="racesClose" aria-label="닫기">✕</button></div>
    <div class="rlist" id="raceList"></div>
  </div>
</div>
<div class="ov" id="setup" hidden>
  <div class="box">
    <div class="tag" id="suTag"></div>
    <h1 id="suName"></h1>
    <div class="meta" id="suMeta"></div>
    <div id="suSegWrap"><div class="lab">종목</div><div class="seg" id="suSeg"></div></div>
    <div><div class="lab">목표 기록</div><div class="chips" id="suChips"></div></div>
    <div class="row"><button class="go sec" id="suCancel">취소</button><button class="go" id="suGo">출발하기</button></div>
    <div class="fine" id="suFine"></div>
  </div>
</div>
<div class="ov" id="result" hidden>
  <div class="box center">
    <p id="rTitle"></p>
    <div class="big" id="rTime"></div>
    <p id="rDiff"></p>
    <div class="row"><button class="go sec" id="again">다시 달리기</button><button class="go" id="toPark">광장으로</button></div>
  </div>
</div>

 let p=NET.peers.get(m.id);if(!p){p={id:String(m.id).slice(0,12)};NET.peers.set(m.id,p)}p.st=m;p.at=performance.now()}

let SU={race:null,key:null,target:0};
function openSetup(raceKey,key){const r=RACES[raceKey];if(SU.race!==raceKey)SU.target=0;SU.race=raceKey;const keysL=Object.keys(r.list);SU.key=key&&r.list[key]?key:SU.key&&r.list[SU.key]?SU.key:keysL[0];
 $("#suTag").textContent=r.tag;$("#suName").textContent=r.name;$("#suFine").textContent=r.fine+" 처음엔 10배속 자동 주행이고, 조이스틱(PC는 W키)을 쓰면 직접 달려요.";
 $("#suSegWrap").hidden=keysL.length<2;$("#suSeg").innerHTML=keysL.map(k=>`<button data-k="${k}" aria-pressed="${k===SU.key}">${r.list[k].label}<small>${r.list[k].official}km</small></button>`).join("");
 drawSU();$("#setup").hidden=false}
function drawSU(){const r=RACES[SU.race],c=r.list[SU.key];if(!c.presets.includes(SU.target))SU.target=c.def;
 $("#suMeta").innerHTML=`${r.date}<br>${c.from} → ${c.to}`;
 $("#suSeg").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===SU.key));
 $("#suChips").innerHTML=c.presets.map(m=>`<button data-m="${m}" aria-pressed="${m===SU.target}">${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}</button>`).join("")}
$("#suSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;SU.key=b.dataset.k;SU.target=0;drawSU()});
$("#suChips").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;SU.target=+b.dataset.m;drawSU()});
$("#suCancel").addEventListener("click",()=>{$("#setup").hidden=true});
$("#suGo").addEventListener("click",()=>{$("#setup").hidden=true;enterCourse(SU.race,SU.key,SU.target)});
const overlayOpen=()=>!$("#races").hidden||!$("#setup").hidden||!$("#result").hidden||!$("#intro").hidden;

/* ---------- 장면 전환 ---------- */
const fade=$("#fade");const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function loadRace(raceKey){if(DATA[raceKey])return;const r=await fetch(RACES[raceKey].file);if(!r.ok)throw new Error(r.status);DATA[raceKey]=await r.json()}
async function enterCourse(raceKey,key,target){
 $("#fadeTxt").textContent=RACES[raceKey].name+" 코스로 이동 중…";fade.classList.add("on");await wait(380);
 try{await loadRace(raceKey)}catch(e){fade.classList.remove("on");toast("코스 데이터를 불러오지 못했어요");return}
 await wait(30);
 if(!C.W||C.W.raceKey!==raceKey||C.W.key!==key)C.W=buildWorld(raceKey,key);
 C.race=RACES[raceKey];C.target=target;buildPace();
 const Cc=C.W.Cc;$("#kmTot").textContent="/ "+(Math.round(Cc.official*10)/10)+" km";$("#lgA").textContent=Cc.from;$("#lgB").textContent=Cc.to;
 S.mult=10;spdB.textContent="10×";if(S.paused)togglePause();S.manual=false;updMode();S.lat=2.6;
 if(cLabel)cMe.remove(cLabel);cLabel=nameSprite(nick,true);cMe.add(cLabel);
 P_.taCancel();S.skipped=false;mode="course";document.body.dataset.mode="course";Object.assign(VIEW.course,{yaw:0,ty:0,pitch:VIEW.course.defP,tp:VIEW.course.defP,vy:0,vp:0});C.active=true;jump(0);S.clock=0;resize();netJoin("course-"+raceKey+"-"+key);
 fade.classList.remove("on")}
async function backToPark(){fade.classList.add("on");$("#fadeTxt").textContent="러너스 파크로 돌아가는 중…";await wait(380);
 C.active=false;$("#result").hidden=true;setNote("",0,"");mode="park";document.body.dataset.mode="park";P_.returnTo(C.W?C.W.raceKey:null);resize();netJoin("park");fade.classList.remove("on")}
$("#back").addEventListener("click",backToPark);$("#toPark").addEventListener("click",backToPark);
$("#again").addEventListener("click",()=>{$("#result").hidden=true;S.skipped=false;S.clock=0;jump(0);S.clock=0});

/* ---------- 루프 ---------- */
let last=performance.now(),t=0,onlineT=0;
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);P_.resize(w,h);cCam.aspect=w/h;cCam.fov=w<h?62:48;cCam.updateProjectionMatrix();drawElev()}addEventListener("resize",resize);resize();
// 프레임이 느리면 화면 해상도를 단계적으로 낮추고, 여유가 생기면 다시 올림
const PR_MAX=Math.min(devicePixelRatio||1,LOW?1.5:2);let prNow=PR_MAX,ftAvg=16,ftT=0,prUps=0;
function adaptRes(ms){ftAvg+=(Math.min(ms,100)-ftAvg)*.05;ftT+=ms/1000;if(ftT<2)return;
 if(ftAvg>24&&prNow>.75){prNow=Math.max(.75,prNow-.25);R.setPixelRatio(prNow);resize();ftT=0}
 else if(ftAvg<12&&prNow<PR_MAX&&ftT>10&&prUps<2){prUps++;prNow=Math.min(PR_MAX,prNow+.25);R.setPixelRatio(prNow);resize();ftT=0}}
function loop(now){const raw=now-last;const dt=Math.min(.05,raw/1000);last=now;t+=dt;if(!document.hidden)adaptRes(raw);
 if(mode==="park"){P_.step(dt,t);if(started)netTick(dt,P_.netState,6);R.render(P_.scene,P_.cam)}else{cStep(dt,t);netTick(dt,cNetState,3);R.render(cScene,cCam)}
 onlineT-=dt;if(onlineT<=0){onlineT=.5;const n=peersIn("p");$("#online").innerHTML=`<b>●</b> `+(n?`${n+1}명 접속 중`:"지금은 혼자예요")}
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* ---------- 닉네임 ---------- */
const BAD=["시발","씨발","병신","개새","좆","fuck","shit","bitch","섹스","자살"];
let gender=load("prerun-gender");
const gSeg=$("#gSeg");const drawG=()=>gSeg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.g===gender));
gSeg.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;gender=b.dataset.g;drawG();setLook(window.__me,gender);$("#err").textContent=""});
function enter(name){nick=name;$("#myName").textContent=name;P_.setName(name);setLook(window.__me,gender);setLook(cMe,gender);const first=!started;$("#intro").hidden=true;started=true;if(first){toast("북쪽 게이트로 대회 입장 · 남쪽 트랙은 타임어택");netJoin("park")}}
$("#introForm").addEventListener("submit",e=>{e.preventDefault();const v=$("#nick").value.trim().replace(/\s+/g," ");
 if(v.length<2){$("#err").textContent="2자 이상 입력해 주세요";return}if(BAD.some(b=>v.toLowerCase().includes(b))){$("#err").textContent="다른 닉네임을 써 주세요";return}
 if(gender!=="m"&&gender!=="f"){$("#err").textContent="캐릭터를 골라 주세요";return}
 save("prerun-nick",v);save("prerun-gender",gender);enter(v)});
const saved=load("prerun-nick");if(saved){$("#nick").value=saved}
if(gender==="m"||gender==="f"){drawG();setLook(window.__me,gender)}else gender=null;
// 왼쪽 위 이름표를 누르면 닉네임·캐릭터 다시 고르기
$(".me").addEventListener("click",()=>{if(mode!=="park")return;$("#nick").value=nick;drawG();$("#intro").hidden=false});
setTimeout(()=>{try{$("#nick").focus()}catch(e){}},300);
netInit();
window.__dbg={cAt,get pr(){return prNow},R,world,cMe,NET,enterCourse,jump,S,C,backToPark,openSetup};
}
</script>
